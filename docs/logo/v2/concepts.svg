m,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">Livros de alturas diferentes numa estante,</text><text x="90.0" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">e um saindo inclinado: o livro que passa</text><text x="90.0" y="722" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">adiante.</text><rect x="562.667" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><title>b-livro-torre</title><rect width="256" height="256" rx="56" fill="#1B4F8F"/><g transform="translate(25.6,25.6) scale(0.8)"><path fill="#fff" d="M24,132C56,120 96,120 122,136V214C96,200 56,198 24,206Z M232,132C200,120 160,120 134,136V214C160,200 200,198 232,206Z M98,76h10v44h-10Z M114,58h10v66h-10Z M130,40h10v84h-10Z M146,62h10v58h-10Z"/></g></svg></g><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet"><title>b-livro-torre</title><rect width="256" height="256" rx="56" fill="#1B4F8F"/><g transform="translate(25.6,25.6) scale(0.8)"><path fill="#fff" d="M24,132C56,120 96,120 122,136V214C96,200 56,198 24,206Z M232,132C200,120 160,120 134,136V214C160,200 200,198 232,206Z M98,76h10v44h-10Z M114,58h10v66h-10Z M130,40h10v84h-10Z M146,62h10v58h-10Z"/></g></svg></g><text x="624.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="682.667" y="548" width="32" height="32" preserveAspectRatio="xMidYMid meet"><title>b-livro-torre</title><rect width="256" height="256" rx="56" fill="#1B4F8F"/><g transform="translate(25.6,25.6) scale(0.8)"><path f